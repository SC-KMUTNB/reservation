name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "ci-mock-jwt-secret-for-typechecking-must-be-32-chars-minimum"
      ENCRYPTION_SECRET: "ci-mock-encryption-secret-typecheck-must-be-32-chars-minimum"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Sync SvelteKit
        run: bunx svelte-kit sync

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run Tests
        run: bun test
